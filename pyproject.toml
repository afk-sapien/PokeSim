[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pokesim"
version = "0.2.0rc4"
description = "A Pokémon Red that plays itself: headless emulator, live web view, event feed with screenshots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "pyboy==2.7.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pillow>=10",
  "numpy",
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/afk-sapien/PokeSim"
Issues = "https://github.com/afk-sapien/PokeSim/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pokesim = "pokesim.__main__:main"
pokesim-prepare-data = "pokesim.prepare_data:main"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]

[tool.setuptools.package-data]
pokesim = ["web/static/*"]

[tool.setuptools.packages.find]
include = ["pokesim*"]
