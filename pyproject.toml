[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pokesim"
version = "0.5.0"
description = "One application for autonomous Pokémon Red and Blue adventures with live views and cable trading"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  # Not on PyPI: GitHub release wheels, so pip, pipx and uv all resolve them from the wheel metadata.
  # Core 0.2.0 asks for pyboy-rs>=0.1.1,<0.2 and the matching wheel below satisfies it. Both carry markers for
  # exactly the platforms that have a pyboy-rs wheel. Core must carry the marker too: its own requirement on
  # pyboy-rs would otherwise send pip to look that name up on PyPI where the platform has no wheel (Windows ARM64,
  # 32-bit ARM, FreeBSD). Neither name is a PyPI project of ours, so no install may ever depend on PyPI for them.
  "pokesim-core[emulator] @ https://raw.githubusercontent.com/afk-sapien/PokeSim/refs/heads/release/0.5.0/tools/temp-wheels/pokesim_core-0.2.0-py3-none-any.whl ; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'arm64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64'))",
  "pyboy-rs @ https://raw.githubusercontent.com/afk-sapien/PokeSim/refs/heads/release/0.5.0/tools/temp-wheels/pyboy_rs-0.1.1-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pyboy-rs @ https://raw.githubusercontent.com/afk-sapien/PokeSim/refs/heads/release/0.5.0/tools/temp-wheels/pyboy_rs-0.1.1-cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "pyboy-rs @ https://raw.githubusercontent.com/afk-sapien/PokeSim/refs/heads/release/0.5.0/tools/temp-wheels/pyboy_rs-0.1.1-cp311-abi3-macosx_10_12_x86_64.whl ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyboy-rs @ https://raw.githubusercontent.com/afk-sapien/PokeSim/refs/heads/release/0.5.0/tools/temp-wheels/pyboy_rs-0.1.1-cp311-abi3-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyboy-rs @ https://raw.githubusercontent.com/afk-sapien/PokeSim/refs/heads/release/0.5.0/tools/temp-wheels/pyboy_rs-0.1.1-cp311-abi3-win_amd64.whl ; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.53.0",
  "pillow>=10",
  "numpy",
  "httpx>=0.27",
  "psutil>=7,<8",
]

[project.urls]
Repository = "https://github.com/afk-sapien/PokeSim"
Issues = "https://github.com/afk-sapien/PokeSim/issues"

[project.optional-dependencies]
dev = ["pytest"]
browser-test = [
    "playwright>=1.50",
]
acceleration = ["numba>=0.61,<0.68"]

[project.scripts]
pokesim = "pokesim.__main__:main"
pokesim-prepare-data = "pokesim.prepare_data:main"
pokesim-desktop = "pokesim.desktop:main"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]

[tool.setuptools.package-data]
pokesim = ["web/static/*", "web/static/fonts/*", "broker/static/*", "_build.json"]

[tool.setuptools.packages.find]
include = ["pokesim*"]

[tool.ruff]
line-length = 130
extend-exclude = [".reference", "build"]

[tool.ruff.lint]
# Pyflakes and syntax errors: the checks that find real mistakes without restyling the code.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then named as test parameters.
"tests/*" = ["F811", "F401"]

[tool.uv]
# pyboy-rs ships abi3 wheels for exactly these platforms, so the lock covers exactly these.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
