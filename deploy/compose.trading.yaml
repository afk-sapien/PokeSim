services:
  trading:
    image: ${POKESIM_IMAGE:-pokesim:0.2.0rc15}
    container_name: pokesim-trading
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "-u", "/coordinator/trade_daemon.py"]
    volumes:
      - "${TRADING_SOURCE:?Set TRADING_SOURCE to the committed tools directory}:/coordinator:ro"
      - "/usr/bin/docker:/usr/local/bin/docker:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/docker/pokesim-trading:/docker/pokesim-trading"
      - "/docker/pokesim/data:/docker/pokesim/data"
      - "/docker/pokesim-blue/data:/docker/pokesim-blue/data"
