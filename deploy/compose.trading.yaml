services:
  trading:
    image: ${POKESIM_IMAGE:-pokesim:0.2.0rc30}
    container_name: pokesim-trading
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    command: ["python", "-u", "-m", "pokesim.trade.service", "--loop"]
    # This worker has no HTTP server. Monitor its coordinator status and transactions.
    healthcheck:
      disable: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/opt/pokesim-trading/state:/trading"
      - "/opt/pokesim/data:/pair/red"
      - "/opt/pokesim-second/data:/pair/blue"
      - "/opt/pokesim/roms/pokered.gb:/roms/red.gb:ro"
      - "/opt/pokesim-second/roms/pokeblue.gb:/roms/blue.gb:ro"
      - "/opt/pokesim/data/game-data:/data/game-data:ro"
