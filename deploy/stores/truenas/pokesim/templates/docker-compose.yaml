{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.pokesim_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_command(["python", "-m", "pokesim", "serve", "--data-dir", "/data", "--host", "0.0.0.0"]) %}
{% do c1.healthcheck.set_custom_test(["CMD", "python", "-m", "pokesim.healthcheck", "--manager"]) %}

{% do c1.environment.add_env("PUBLIC_URL", values.pokesim.public_url) %}
{% do c1.environment.add_env("PORT", values.consts.container_port) %}
{% do c1.environment.add_env("NTFY_URL", values.pokesim.ntfy_url) %}
{% do c1.environment.add_env("NTFY_TOKEN", values.pokesim.ntfy_token) %}
{% do c1.environment.add_env("NTFY_MIN_PRIORITY", values.pokesim.ntfy_min_priority) %}
{% do c1.environment.add_env("NTFY_MUTE", values.pokesim.ntfy_mute) %}
{% do c1.environment.add_user_envs(values.pokesim.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.container_port}) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 256}}) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
