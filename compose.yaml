services:
  pokesim:
    image: ${POKESIM_IMAGE:-pokesim:local}
    init: true
    restart: unless-stopped
    command: [python, -m, pokesim, serve, --data-dir, /data, --host, 0.0.0.0]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8930}:8000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8930}
      PORT: "8000"
    volumes:
      - ${DATA_PATH:-./pokesim-app}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 90s
