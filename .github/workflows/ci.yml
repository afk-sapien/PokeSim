name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: uv sync --locked --extra dev
      - name: Read user-content reference for tests only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pret/pokered
          ref: a1a22aaf84d1675bcdbaeb194592379d586d838e
          path: .reference/pokered
          persist-credentials: false
      - run: uv run --locked python -m pokesim.prepare_data .reference/pokered
      - run: uv run --locked pytest --ignore=tests/test_rom.py -q
      - run: python tools/check_web.py
      - run: python tools/check_docs.py
      - run: uv build
      - run: python tools/check_package.py
      - name: Verify installation outside the source checkout
        if: matrix.python == '3.12'
        run: python tools/check_installed_wheel.py
      - name: Install browser test runtime
        if: matrix.python == '3.12'
        run: |
          uv sync --locked --extra dev --extra browser-test
          uv run --locked --extra browser-test python -m playwright install --with-deps chromium
      - name: Exercise real browser flows
        if: matrix.python == '3.12'
        env:
          POKESIM_BROWSER_TESTS: '1'
        run: |
          mkdir -p build
          uv run --locked --extra dev --extra browser-test pytest tests/browser -q --basetemp=build/browser-tests
      - name: Retain browser diagnostics on failure
        if: failure() && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-diagnostics
          path: build/browser-tests/**/browser-trace.zip
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker compose config --quiet
      - run: docker build -t pokesim:ci .
      - name: Verify the Compose installation and save lifecycle
        run: python tools/check_container.py pokesim:ci
      - name: Prepare local data outside the image
        run: docker run --rm -v pokesim-ci-data:/data pokesim:ci python -m pokesim.prepare_data --download
      - name: Verify repeated setup works offline
        run: docker run --rm --network none --read-only --cap-drop ALL -v pokesim-ci-data:/data pokesim:ci python -m pokesim.prepare_data --download
      - name: Verify installed runtime and non-root user
        run: |
          docker run --rm -i -v pokesim-ci-data:/data --entrypoint python pokesim:ci <<'PYCODE'
          import os
          import pyboy
          import pokesim.strategy_data
          import pokesim.web.app
          import pokesim.healthcheck
          assert os.getuid() != 0
          from pathlib import Path
          assert not (Path(pokesim.__file__).parent / 'data/strategy.json').exists()
          assert Path('/usr/share/pokesim/sources/pyboy-2.7.0.tar.gz').is_file()
          PYCODE
