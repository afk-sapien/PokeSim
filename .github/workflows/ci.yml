name: CI
on:
  # Branches are tested through their pull request, so a push runs only on main, feature branches and
  # tags. The release gate and the deploy script need those push runs as evidence for the exact commit.
  # Pull requests and branch pushes test Python 3.12 on Linux x86 only. A tag, the nightly run and a manual
  # run test the full matrix, which the release gate requires for the tagged commit.
  push:
    branches: [main, 'feature/**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A pull request's new push cancels its older run. Every other run is the evidence the publish workflow
  # and the deploy script require for an exact commit, so each has its own group and always finishes.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          cache-suffix: audit
      - name: Export the pinned runtime dependencies
        # Offline first, so a release-asset outage cannot fail the export. See .github/actions/uv-sync.
        run: |
          set -- --locked --no-dev --no-emit-project --no-emit-package pokecore --no-emit-package pyboy-rs --format requirements-txt --output-file runtime-requirements.txt
          UV_OFFLINE=1 uv export "$@" || UV_HTTP_RETRIES=10 uv export "$@"
      - name: Check runtime dependency advisories
        run: uvx pip-audit==2.10.1 --require-hashes --disable-pip -r runtime-requirements.txt
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
      # packages/pokecore keeps its own ruff settings in its pyproject.toml, at this same ruff version.
      - run: uvx ruff==0.16.9 check pokesim tests tools conftest.py packages/pokecore
  pokecore:
    # pokecore's own suite from packages/pokecore, with the locked emulator and no silent skips. Then its
    # wheel alone in a clean environment, the surface other projects import without an emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["3.11", "3.12", "3.14"]' || '["3.12"]') }}
    name: pokecore (${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      - name: Run the pokecore suite without silent skips
        working-directory: packages/pokecore
        run: |
          uv run pytest -rs -q -p no:cacheprovider --ignore=tests/test_snapshot_native.py --ignore=tests/test_real_roms.py | tee "$RUNNER_TEMP/pokecore.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/pokecore.log"; then echo "Unexpected skips"; exit 1; fi
      - name: Install the built pokecore wheel alone
        run: |
          uv build --package pokecore --wheel --out-dir "$RUNNER_TEMP/pokecore-dist"
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install "$RUNNER_TEMP"/pokecore-dist/pokecore-*.whl pytest
          "$RUNNER_TEMP/clean/bin/python" -c "import importlib.util as u; assert u.find_spec('pyboy_rs') is None and u.find_spec('pyboy') is None"
      - name: Import the legacy surface and run the tests that need no emulator
        working-directory: packages/pokecore
        run: |
          "$RUNNER_TEMP/clean/bin/python" tools/check_legacy_surface.py
          "$RUNNER_TEMP/clean/bin/python" -m pytest -q -p no:cacheprovider
  pokecore-native:
    # The experimental Rust decoders in packages/pokecore/native, held to the Python decoders' results.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path packages/pokecore/native/Cargo.toml --check
      - run: cargo clippy --manifest-path packages/pokecore/native/Cargo.toml -- -D warnings
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      - name: Build and install the decoder wheel
        run: |
          uvx --from 'maturin>=1.9,<2' maturin build --release --manifest-path packages/pokecore/native/Cargo.toml --out "$RUNNER_TEMP/native-dist"
          uv pip install "$RUNNER_TEMP"/native-dist/pokesim_core_native-*.whl
      - name: Run the decoder tests against the Rust decoder without silent skips
        working-directory: packages/pokecore
        run: |
          POKESIM_CORE_DECODER=rust uv run pytest -rs -q -p no:cacheprovider tests/test_snapshot_native.py | tee "$RUNNER_TEMP/native.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/native.log"; then echo "Unexpected skips"; exit 1; fi
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["3.11", "3.12", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      # Stylelint is a development tool only. tests/test_stylelint.py runs it once it is installed.
      - name: Lint stylesheets
        if: matrix.python == '3.12'
        run: |
          npm ci --no-audit --no-fund
          npm run lint:css
      - name: Read user-content reference for tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokered
          ref: a1a22aaf84d1675bcdbaeb194592379d586d838e
          path: .reference/pokered
          persist-credentials: false
      - run: uv run --locked python -m pokesim.prepare_data .reference/pokered
      - name: Read Yellow user-content reference for tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: .reference/pokeyellow
          persist-credentials: false
      - run: uv run --locked python -m pokesim.prepare_data .reference/pokeyellow --yellow
      # tests/test_gen2_map_facts.py regenerates the Gen II map facts from these and fails on drift.
      - name: Read Crystal user-content reference for tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokecrystal
          ref: 5beda23ffa505f62e1dad7e3d7c214d1737b3358
          path: .reference/pokecrystal
          persist-credentials: false
      - name: Read Gold and Silver user-content reference for tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokegold
          ref: 62388c7204e5d13aa05b4231e220b6760584d1b5
          path: .reference/pokegold
          persist-credentials: false
      - name: Generate Gen II game data from pinned public sources
        run: uv run --locked python tools/prepare_gen2_test_data.py "$RUNNER_TEMP/gen2-data"
      - run: uv run --locked pytest --ignore=tests/test_rom.py --ignore=tests/browser -q
        env:
          GEN2_DATA_DIR: ${{ runner.temp }}/gen2-data
      - name: Rollback check, a Rust-written Gen 1 state loads into PyBoy 2.7.0
        if: matrix.python == '3.12'
        run: uv run --locked --with pyboy==2.7.0 pytest -q tests/test_pyboy_state_compat.py -rs
      - name: Live API smoke check against a server started here, with and without accounts
        if: matrix.python == '3.12'
        run: |
          uv run --locked sh tools/smoke_server.sh accounts
          uv run --locked sh tools/smoke_server.sh none
      - run: python tools/check_web.py
      - run: python tools/check_docs.py
      - run: uv build
      - run: python tools/check_package.py
      - name: Verify installation outside the source checkout
        if: matrix.python == '3.12'
        run: python tools/check_python_install.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    name: browser (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - name: Read user-content reference for tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokered
          ref: a1a22aaf84d1675bcdbaeb194592379d586d838e
          path: .reference/pokered
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev --extra browser-test
      - name: Install browser test runtime
        run: uv run --locked --extra browser-test python -m playwright install --with-deps chromium
      - run: uv run --locked python -m pokesim.prepare_data .reference/pokered
      - name: Exercise real browser flows
        env:
          POKESIM_BROWSER_TESTS: '1'
          POKESIM_TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p build
          # The browser checks wait on real timers, so each shard runs them in one process.
          uv run --locked --extra dev --extra browser-test pytest tests/browser -n 0 -q --durations=10 --basetemp=build/browser-tests --junitxml=build/junit.xml
      - name: Keep the test times for tools/record_durations.py
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-browser-${{ strategy.job-index }}
          path: build/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-diagnostics-${{ strategy.job-index }}
          path: build/browser-tests/**/browser-trace.zip
          if-no-files-found: ignore
  container:
    # The release publishes amd64 and arm64 images, so the full matrix builds and checks each on a native
    # runner. Pull requests and branch pushes check amd64 only.
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[{"arch": "amd64", "runner": "ubuntu-latest"}, {"arch": "arm64", "runner": "ubuntu-24.04-arm"}]' || '[{"arch": "amd64", "runner": "ubuntu-latest"}]') }}
    name: container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose config --quiet
      - run: docker build --pull -t pokesim:ci .
      - name: Verify the Compose installation and save lifecycle
        run: python tools/check_container.py pokesim:ci
      - name: Verify the new-user Docker setup and persistent volume
        run: python tools/check_quickstart.py pokesim:ci
      - name: Prepare local data outside the image
        run: docker run --rm -v pokesim-ci-data:/data pokesim:ci python -m pokesim.prepare_data --download
      - name: Verify repeated setup works offline
        run: docker run --rm --network none --read-only --cap-drop ALL -v pokesim-ci-data:/data pokesim:ci python -m pokesim.prepare_data --download
      - name: Verify installed runtime and non-root user
        run: |
          docker run --rm -i -v pokesim-ci-data:/data --entrypoint python pokesim:ci <<'PYCODE'
          import os
          import json
          import importlib.metadata
          import pyboy_rs
          import pokecore.emulator
          import pokesim.strategy_data
          import pokesim.web.app
          import pokesim.healthcheck
          assert os.getuid() != 0
          # pokecore is built from the workspace copy in packages/pokecore, not from a release wheel.
          origin = json.loads(importlib.metadata.distribution('pokecore').read_text('direct_url.json'))
          assert origin['url'] == 'file:///app/packages/pokecore', origin
          from pathlib import Path
          assert not (Path(pokesim.__file__).parent / 'data/strategy.json').exists()
          assert list(Path('/usr/share/pokesim/sources').glob('pyboy-rs-*.tar.gz'))
          pokecore.emulator.check_runtime()
          from pokesim.policies.navigation_numba import kernel
          assert kernel() is not None, 'the image should compile route searches'
          assert os.listdir(os.environ['NUMBA_CACHE_DIR']), 'compiled searches should be cached'
          PYCODE
      - name: Reject fixable high and critical image vulnerabilities
        run: |
          docker save pokesim:ci -o /tmp/pokesim-app.tar
          chmod 644 /tmp/pokesim-app.tar
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
            -v /tmp/pokesim-app.tar:/image.tar:ro -v /tmp/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.74.0 image --input /image.tar --scanners vuln \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
  gate:
    # The one check the branch ruleset requires, so a new or renamed job above cannot be skipped by accident.
    name: ci gate
    if: always()
    needs: [dependency-audit, lint, pokecore, pokecore-native, tests, browser, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
