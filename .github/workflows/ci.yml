name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.17'
      - name: Export the pinned runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
      - name: Check runtime dependency advisories
        run: uvx pip-audit==2.10.1 --require-hashes --disable-pip -r runtime-requirements.txt
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: uv sync --locked --extra dev
      - name: Read user-content reference for tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokered
          ref: a1a22aaf84d1675bcdbaeb194592379d586d838e
          path: .reference/pokered
          persist-credentials: false
      - run: uv run --locked python -m pokesim.prepare_data .reference/pokered
      - run: uv run --locked pytest --ignore=tests/test_rom.py -q
      - run: python tools/check_web.py
      - run: python tools/check_docs.py
      - run: uv build
      - run: python tools/check_package.py
      - name: Verify installation outside the source checkout
        if: matrix.python == '3.12'
        run: python tools/check_python_install.py
      - name: Install browser test runtime
        if: matrix.python == '3.12'
        run: |
          uv sync --locked --extra dev --extra browser-test
          uv run --locked --extra browser-test python -m playwright install --with-deps chromium
      - name: Exercise real browser flows
        if: matrix.python == '3.12'
        env:
          POKESIM_BROWSER_TESTS: '1'
        run: |
          mkdir -p build
          uv run --locked --extra dev --extra browser-test pytest tests/browser -q --basetemp=build/browser-tests
      - name: Retain browser diagnostics on failure
        if: failure() && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-diagnostics
          path: build/browser-tests/**/browser-trace.zip
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose config --quiet
      - run: docker build --pull -t pokesim:ci .
      - name: Verify the Compose installation and save lifecycle
        run: python tools/check_container.py pokesim:ci
      - name: Verify the authenticated HTTPS proxy
        run: python tools/check_proxy_boundary.py pokesim:ci
      - name: Reject fixable high and critical image vulnerabilities
        run: |
          docker save pokesim:ci -o /tmp/pokesim-app.tar
          docker save pokesim-proxy:2.11.4-hardened-20260919 -o /tmp/pokesim-proxy.tar
          chmod 644 /tmp/pokesim-app.tar /tmp/pokesim-proxy.tar
          for image in app proxy
          do
            docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
              -v "/tmp/pokesim-$image.tar:/image.tar:ro" -v /tmp/trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.74.0 image --input /image.tar --scanners vuln \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
          done
      - name: Prepare local data outside the image
        run: docker run --rm -v pokesim-ci-data:/data pokesim:ci python -m pokesim.prepare_data --download
      - name: Verify repeated setup works offline
        run: docker run --rm --network none --read-only --cap-drop ALL -v pokesim-ci-data:/data pokesim:ci python -m pokesim.prepare_data --download
      - name: Verify installed runtime and non-root user
        run: |
          docker run --rm -i -v pokesim-ci-data:/data --entrypoint python pokesim:ci <<'PYCODE'
          import os
          import pyboy
          import pokesim.strategy_data
          import pokesim.web.app
          import pokesim.healthcheck
          assert os.getuid() != 0
          from pathlib import Path
          assert not (Path(pokesim.__file__).parent / 'data/strategy.json').exists()
          assert Path('/usr/share/pokesim/sources/pyboy-2.7.0.tar.gz').is_file()
          PYCODE
