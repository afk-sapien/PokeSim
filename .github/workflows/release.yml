name: Publish public release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing draft GitHub release, for example v0.4.17
        required: true
        type: string
      dry_run:
        description: Build and verify everything but publish nothing (no image push, no release upload, no release edit)
        required: false
        default: false
        type: boolean
      images_from_run:
        description: Publish the tested images and packages of this earlier run of the same tag instead of this run's builds
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub exposes draft releases only to identities with push access.
      contents: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Refuse unfinished release pins and compare the locked assets with the published ones
        # No temporary wheel URL, branch ref, temp-wheels directory or TEMP marker may remain, the pyproject URLs must
        # carry the locked #sha256 fragments, the Dockerfile checksum must match the source archive, and every locked
        # emulator asset must download with exactly the hash recorded in uv.lock.
        run: python tools/check_release_pins.py --remote
      - name: Validate public release destination
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from urllib.request import Request, urlopen
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:rc\d+)?', tag), 'Invalid release tag'
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert tag == 'v' + version, 'Tag must match package version'
          from pathlib import Path
          heading = Path('docs/release-notes.md').read_text().splitlines()[0]
          assert heading.startswith('# PokeSim ' + version + ' '), 'Review release notes for this version first'
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urlopen(Request('https://api.github.com/repos/' + repo, headers=headers)) as response:
              assert json.load(response)['visibility'] == 'public', 'This workflow publishes only reviewed public source'
          dry_run = os.environ['DRY_RUN'] == 'true'
          releases = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}'
              with urlopen(Request(url, headers=headers)) as response:
                  batch = json.load(response)
              releases.extend(release for release in batch if release['tag_name'] == tag)
              if len(batch) < 100:
                  break
              page += 1
          release = releases[0] if releases else {'id': ''}
          if not dry_run:
              assert len(releases) == 1, 'Create exactly one draft GitHub release for this tag first'
              assert release['draft'], 'Only draft releases can be built and published'
              assert not any(asset['name'].startswith('image-linux-') for asset in release['assets']), \
                  'This version already has published downloads. Publish a new version.'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image=ghcr.io/{repo.lower()}:{version}\nversion={version}\nrevision={revision}\n')
              output.write(f'release_id={release["id"]}\n')
          PY
  gate:
    # The verification matrix is not repeated here. The CI and Python install workflows already ran on the
    # exact commit (their push runs on main or on the tag), so this job requires those runs to have
    # succeeded and waits for any that are still running.
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      # The gate script comes from the commit that dispatched this workflow, not from the release revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          path: release-source
          persist-credentials: false
      - name: Require final pins, then passing CI and Python install runs for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: python tools/check_release_gates.py --sha "$REVISION" --tree release-source --timeout 2100
  build:
    # Runs in parallel with the gate. It holds no credentials that can publish and uploads nothing public.
    # Each image is built and tested on a runner of its own architecture, so nothing runs under emulation.
    needs: validate
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      # The Python packages do not depend on the architecture, so only the amd64 leg builds them.
      - if: matrix.arch == 'amd64'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.18'
      - if: matrix.arch == 'amd64'
        run: uv sync --locked --extra dev
      - if: matrix.arch == 'amd64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokered
          ref: a1a22aaf84d1675bcdbaeb194592379d586d838e
          path: .reference/pokered
          persist-credentials: false
      - if: matrix.arch == 'amd64'
        run: uv run --locked python -m pokesim.prepare_data .reference/pokered
      - if: matrix.arch == 'amd64'
        run: uv build
      - if: matrix.arch == 'amd64'
        run: python tools/check_package.py
      - if: matrix.arch == 'amd64'
        run: python tools/check_python_install.py
      - name: Build and test the versioned image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          docker build --platform "linux/$ARCH" --build-arg VERSION="$VERSION" --build-arg REVISION="$REVISION" \
            -t "$IMAGE" -t "$IMAGE-linux-$ARCH" .
          python tools/check_container.py "$IMAGE"
          python tools/check_quickstart.py "$IMAGE"
      - name: Keep the tested image and packages for the publish job
        # The archive carries the plain version tag too, so an offline load works with the release Compose file.
        run: |
          mkdir -p release
          docker save "$IMAGE" "$IMAGE-linux-$ARCH" | gzip > "release/image-linux-$ARCH.tar.gz"
          if [ "$ARCH" = amd64 ]; then cp dist/* release/; fi
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-inputs-${{ matrix.arch }}
          path: release/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  rehearse:
    # The publish job repeats these steps against the registry image. Running them here without a registry
    # finds identity, checksum, and Compose problems before an image is pushed, and in a dry run.
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-inputs-*
          merge-multiple: true
          path: rehearsal
      - name: Rehearse release assembly before anything is published
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          for arch in amd64 arm64; do
            docker load --input "rehearsal/image-linux-$arch.tar.gz"
            docker image inspect "$IMAGE-linux-$arch" --format '{{json .}}' > "rehearsal/image-metadata-linux-$arch.json"
          done
          cp compose.yaml compose.quickstart.yaml install.sh install.ps1 rehearsal/
          cp .env.example rehearsal/env.example
          docker run --rm --network none "$IMAGE-linux-amd64" cat /usr/share/pokesim/python-dependencies.json > rehearsal/python-dependencies.json
          python tools/assemble_release.py rehearsal --version "$VERSION" --revision "$REVISION" --without-desktop
  publish:
    # The only job that can push an image or change a release. A dry run never reaches it.
    if: ${{ inputs.dry_run != true }}
    needs: [validate, gate, build, rehearse]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      # The registry checks come from the commit that dispatched this workflow, so a fixed check can publish
      # an unchanged tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dispatch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-inputs-*
          merge-multiple: true
          path: release
          run-id: ${{ inputs.images_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image and verify anonymous access
        id: image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          REVISION: ${{ needs.validate.outputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/pokesim-publish-auth
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load --input "release/image-linux-$arch.tar.gz"
            built=$(docker image inspect "$IMAGE-linux-$arch" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [ "$built" = "$REVISION" ] || { echo "The $arch image was built from $built, not $REVISION"; exit 1; }
            # A rerun may push the same image again, never a different one under a version already in GHCR.
            python dispatch/tools/check_registry_image.py "$IMAGE-linux-$arch" --unchanged
            python dispatch/tools/check_registry_image.py "$IMAGE" --unchanged --platform "linux/$arch" --tested "$IMAGE-linux-$arch"
            docker push "$IMAGE-linux-$arch"
            # Record the pushed digest now. The anonymous pulls below add more digests to the local image.
            docker image inspect "$IMAGE-linux-$arch" --format '{{json .}}' > "release/image-metadata-linux-$arch.json"
          done
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-linux-amd64" "$IMAGE-linux-arm64"
          digest=$(python dispatch/tools/check_registry_image.py "$IMAGE" --index linux/amd64,linux/arm64)
          echo "index_digest=$digest" >> "$GITHUB_OUTPUT"
          for arch in amd64 arm64; do
            python dispatch/tools/check_registry_image.py "$IMAGE" --platform "linux/$arch" --tested "$IMAGE-linux-$arch"
          done
      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/pokesim-publish-auth
        run: docker logout ghcr.io
      - name: Assemble versioned release downloads
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          INDEX_DIGEST: ${{ steps.image.outputs.index_digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          cp compose.yaml compose.quickstart.yaml install.sh install.ps1 release/
          cp .env.example release/env.example
          docker run --rm --network none "$IMAGE-linux-amd64" cat /usr/share/pokesim/python-dependencies.json > release/python-dependencies.json
          python tools/assemble_release.py release --version "$VERSION" --revision "$REVISION" --image "$IMAGE" \
            --index-digest "$INDEX_DIGEST" --without-desktop
      - name: Upload and verify the release downloads
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          release_id = os.environ['RELEASE_ID']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/{release_id}']))
          assert release['draft'] and release['tag_name'] == tag, 'Release identity changed during the build'
          assets = {asset['name']: asset for asset in release['assets']}
          files = list(Path('release').iterdir())
          assert set(assets) == {path.name for path in files}, 'Uploaded asset set is incomplete'
          for path in files:
              with path.open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              assert assets[path.name]['digest'] == digest, f'Upload verification failed: {path.name}'
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false',
                          '--prerelease=' + str('rc' in tag).lower(),
                          '--latest=' + str('rc' not in tag).lower()], check=True)
          PY
      - name: Move the floating image tags
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/pokesim-publish-auth
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')
          tags=$(python tools/floating_tags.py "$VERSION" $published)
          [ -n "$tags" ] || { echo 'No floating tags move for this release'; exit 0; }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in $tags; do
            docker buildx imagetools create --tag "${IMAGE%:*}:$tag" "$IMAGE"
          done
          docker logout ghcr.io
          for tag in $tags; do
            python dispatch/tools/check_registry_image.py "${IMAGE%:*}:$tag" --index linux/amd64,linux/arm64
            for arch in amd64 arm64; do
              python dispatch/tools/check_registry_image.py "${IMAGE%:*}:$tag" --platform "linux/$arch" --tested "$IMAGE-linux-$arch"
            done
          done
      - name: Remove registry credentials after the floating tags
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/pokesim-publish-auth
        run: docker logout ghcr.io
