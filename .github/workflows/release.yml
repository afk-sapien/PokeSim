name: Publish public release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing GitHub release, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate public release destination
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:rc\d+)?', tag), 'Invalid release tag'
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert tag == 'v' + version, 'Tag must match package version'
          from pathlib import Path
          heading = Path('docs/release-notes.md').read_text().splitlines()[0]
          assert heading.startswith('# PokeSim ' + version + ' '), 'Review release notes for this version first'
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urlopen(Request('https://api.github.com/repos/' + repo, headers=headers)) as response:
              assert json.load(response)['visibility'] == 'public', 'This workflow publishes only reviewed public source'
          try:
              with urlopen(Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers=headers)) as response:
                  release = json.load(response)
          except HTTPError as error:
              if error.code == 404:
                  raise SystemExit('Create and publish the GitHub release for this tag first')
              raise
          assert not any(asset['name'] == 'image-linux-amd64.tar.gz' for asset in release['assets']), \
              'This version already has published downloads. Publish a new version.'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image=ghcr.io/{repo.lower()}:{version}\nversion={version}\nrevision={revision}\n')
          PY
  python-install:
    needs: validate
    uses: ./.github/workflows/python-install.yml
    with:
      ref: ${{ needs.validate.outputs.revision }}
  release:
    needs: [validate, python-install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python tools/check_web.py
      - run: python tools/check_docs.py
      - run: uv sync --locked --extra dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pret/pokered
          ref: a1a22aaf84d1675bcdbaeb194592379d586d838e
          path: .reference/pokered
          persist-credentials: false
      - run: uv run --locked python -m pokesim.prepare_data .reference/pokered
      - run: uv run --locked pytest --ignore=tests/test_rom.py -q
      - name: Validate real browser flows before publishing
        env:
          POKESIM_BROWSER_TESTS: '1'
        run: |
          uv sync --locked --extra dev --extra browser-test
          uv run --locked --extra browser-test python -m playwright install --with-deps chromium
          uv run --locked --extra dev --extra browser-test pytest tests/browser -q
      - run: uv build
      - run: python tools/check_package.py
      - run: python tools/check_python_install.py
      - name: Build and test the versioned image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" --build-arg REVISION="$REVISION" -t "$IMAGE" .
          python tools/check_container.py "$IMAGE"
      - name: Publish image and verify anonymous access
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/pokesim-publish-auth
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          python tools/check_registry_image.py "$IMAGE"
      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/pokesim-publish-auth
        run: docker logout ghcr.io
      - name: Assemble versioned release downloads
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          mkdir -p release
          docker save "$IMAGE" | gzip > release/image-linux-amd64.tar.gz
          cp dist/* release/
          cp compose.yaml release/compose.yaml
          cp .env.example release/env.example
          docker run --rm --network none "$IMAGE" cat /usr/share/pokesim/python-dependencies.json > release/python-dependencies.json
          docker image inspect "$IMAGE" --format '{{json .}}' > release/image-metadata.json
          python tools/assemble_release.py release --version "$VERSION" --revision "$REVISION" --image "$IMAGE" --without-desktop
      - name: Upload and verify the release downloads
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          assets = {asset['name']: asset for asset in release['assets']}
          files = list(Path('release').iterdir())
          assert set(assets) == {path.name for path in files}, 'Uploaded asset set is incomplete'
          for path in files:
              with path.open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              assert assets[path.name]['digest'] == digest, f'Upload verification failed: {path.name}'
          subprocess.run(['gh', 'release', 'edit', tag,
                          '--prerelease=' + str('rc' in tag).lower()], check=True)
          PY
