name: Python install
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.7'
      - run: uv sync --locked --extra dev
      - name: Prepare verified reference data without a private ROM
        run: uv run --locked python tools/prepare_test_data.py
      - name: Test native service and Python launcher
        run: uv run --locked pytest --ignore=tests/test_rom.py -q
      - run: uv build
      - name: Check package resources and exclude private data
        run: uv run --locked python tools/check_package.py
      - name: Install wheel and test Library and native workers outside the checkout
        run: uv run --locked python tools/check_python_install.py
