name: Python install
on:
  # Branches are tested through their pull request, so a push runs only on main, feature branches and
  # tags. The release gate and the deploy script need those push runs as evidence for the exact commit.
  # Every pull request runs it too, documentation only or not, because the ruleset requires its gate.
  # Pull requests and branch pushes run on Linux x86 only. A tag, the nightly run and a manual run cover
  # every platform, which the release gate requires for the tagged commit.
  push:
    branches: [main, 'feature/**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A pull request's new push cancels its older run. Every other run is the evidence the publish workflow
  # and the deploy script require for an exact commit, so each has its own group and always finishes.
  group: python-install-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-tests:
    name: native tests (${{ matrix.os }}, ${{ matrix.shard }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[{"os": "ubuntu-22.04", "shard": "1/1"}, {"os": "ubuntu-24.04-arm", "shard": "1/1"}, {"os": "macos-15", "shard": "1/1"}, {"os": "macos-15-intel", "shard": "1/1"}, {"os": "windows-latest", "shard": "1/4"}, {"os": "windows-latest", "shard": "2/4"}, {"os": "windows-latest", "shard": "3/4"}, {"os": "windows-latest", "shard": "4/4"}]' || '[{"os": "ubuntu-22.04", "shard": "1/1"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      - name: Prepare verified reference data without a private ROM
        run: uv run --locked python tools/check_install.py prepare-data
      - name: Test native service and Python launcher
        env:
          POKESIM_TEST_SHARD: ${{ matrix.shard }}
          # Windows is already split into four jobs, and starting test workers there cost more than they saved.
          PYTEST_ADDOPTS: ${{ startsWith(matrix.os, 'windows') && '-n 0' || '' }}
        run: uv run --locked pytest --ignore=tests/test_rom.py -q -o faulthandler_timeout=120 --durations=10 --junitxml=build/junit.xml
      - name: Keep the test times for tools/record_durations.py
        if: matrix.os == 'ubuntu-22.04' && (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit-native-ubuntu
          path: build/junit.xml
          retention-days: 14
          if-no-files-found: ignore
  install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-22.04", "ubuntu-24.04-arm", "windows-latest", "macos-15-intel", "macos-15"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      - name: Prepare verified reference data without a private ROM
        run: uv run --locked python tools/check_install.py prepare-data
      - run: uv build
      - name: Check package resources and exclude private data
        run: uv run --locked python tools/check_install.py package
      - name: Install wheel and test Library and native workers outside the checkout
        run: uv run --locked python tools/check_install.py python-install --workspace-pokecore
      - name: Verify the user-facing installer and repeat installation
        run: uv run --locked python tools/check_install.py installer --workspace-pokecore
  acceleration:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
          enable-cache: false
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev --extra acceleration
      - run: uv run --locked --extra acceleration python tools/check_install.py prepare-data
      - name: Verify compiled paths and fallback behavior
        run: uv run --locked --extra dev --extra acceleration pytest -q tests/test_navigation_numba.py tests/test_navigation_equivalence.py
      - run: uv build
      - name: Test installed workers with optional acceleration
        run: uv run --locked --extra acceleration python tools/check_install.py python-install --acceleration --workspace-pokecore
  gate:
    # The one check the branch ruleset requires, so a new or renamed job above cannot be skipped by accident.
    name: install gate
    if: always()
    needs: [native-tests, install, acceleration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
