name: Python install
on:
  # Branches are tested through their pull request, so a push runs only on main, feature branches and
  # tags. The release gate and the deploy script need those push runs as evidence for the exact commit.
  # Every pull request runs it too, documentation only or not, because the ruleset requires its gate.
  push:
    branches: [main, 'feature/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-install-${{ github.workflow }}-${{ github.ref }}
  # Runs on main, feature branches and tags are the evidence the publish workflow and the deploy script
  # require, so they are never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/feature/') && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  native-tests:
    name: native tests (${{ matrix.os }}, ${{ matrix.shard }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, shard: '1/1'}
          - {os: ubuntu-24.04-arm, shard: '1/1'}
          - {os: macos-15, shard: '1/1'}
          - {os: macos-15-intel, shard: '1/1'}
          - {os: windows-latest, shard: '1/4'}
          - {os: windows-latest, shard: '2/4'}
          - {os: windows-latest, shard: '3/4'}
          - {os: windows-latest, shard: '4/4'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      - name: Prepare verified reference data without a private ROM
        run: uv run --locked python tools/prepare_test_data.py
      - name: Test native service and Python launcher
        env:
          POKESIM_TEST_SHARD: ${{ matrix.shard }}
          # Windows is already split into four jobs, and starting test workers there cost more than they saved.
          PYTEST_ADDOPTS: ${{ startsWith(matrix.os, 'windows') && '-n 0' || '' }}
        run: uv run --locked pytest --ignore=tests/test_rom.py -q -o faulthandler_timeout=120 --durations=10
  install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev
      - name: Prepare verified reference data without a private ROM
        run: uv run --locked python tools/prepare_test_data.py
      - run: uv build
      - name: Check package resources and exclude private data
        run: uv run --locked python tools/check_package.py
      - name: Install wheel and test Library and native workers outside the checkout
        run: uv run --locked python tools/check_python_install.py
      - name: Verify the user-facing installer and repeat installation
        run: uv run --locked python tools/check_installer.py
  acceleration:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.18'
      - uses: ./.github/actions/uv-sync
        with:
          args: --extra dev --extra acceleration
      - run: uv run --locked --extra acceleration python tools/prepare_test_data.py
      - name: Verify compiled paths and fallback behavior
        run: uv run --locked --extra dev --extra acceleration pytest -q tests/test_navigation_numba.py tests/test_navigation_equivalence.py
      - run: uv build
      - name: Test installed workers with optional acceleration
        run: uv run --locked --extra acceleration python tools/check_python_install.py --acceleration
  gate:
    # The one check the branch ruleset requires, so a new or renamed job above cannot be skipped by accident.
    name: install gate
    if: always()
    needs: [native-tests, install, acceleration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
