name: Experimental standalone builds
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.15'
      - run: uv sync --locked --extra dev --extra desktop-build
      - name: Prepare verified reference data for tests
        run: uv run --locked python tools/prepare_desktop_test_data.py
      - name: Test native service and launcher
        run: uv run --locked pytest --ignore=tests/test_rom.py -q
      - name: Build desktop application
        run: uv run --locked python tools/build_desktop.py
      - name: Extract and test the actual desktop download
        run: uv run --locked python tools/check_desktop_archive.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokesim-desktop-${{ matrix.label }}
          path: |
            dist/desktop/PokeSim-*.zip
            dist/desktop/PokeSim-*.tar.gz
            dist/desktop/PokeSim-*.sha256
            dist/desktop/PokeSim-*.json
          if-no-files-found: error
