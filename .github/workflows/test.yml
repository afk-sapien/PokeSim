name: Tests
on: [push, pull_request]
permissions:
  contents: read
env:
  # The emulator job installs the released PyBoy RS v0.1.5 Linux x86_64 wheel from its GitHub release,
  # pinned by SHA-256 (from the release's SHA256SUMS.txt). PyBoy RS is not on PyPI.
  PYBOY_RS_WHEEL_URL: https://github.com/afk-sapien/pyboy-rs/releases/download/v0.1.5/pyboy_rs-0.1.5-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
  PYBOY_RS_WHEEL_SHA256: 85d000b9d6607f449b6a945bed7923ca3e1adb5bb97dc1606508501eef1da89d
jobs:
  test:
    name: pure Python (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync --python ${{ matrix.python }} ruff check .
      - run: uv run --no-sync --python ${{ matrix.python }} pytest
      - run: uv build

  emulator:
    name: emulator and RTC (PyBoy RS v0.1.5 release wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the released PyBoy RS wheel and Core with the emulator
        run: |
          mkdir -p dist
          curl -fsSL --retry 3 -o "dist/${PYBOY_RS_WHEEL_URL##*/}" "$PYBOY_RS_WHEEL_URL"
          echo "$PYBOY_RS_WHEEL_SHA256  dist/${PYBOY_RS_WHEEL_URL##*/}" | sha256sum -c -
          python -m pip install dist/pyboy_rs-*.whl
          python -m pip install -e ".[dev]" pillow numpy
      - name: Require version 0.1.5
        run: python -c "import pyboy_rs; assert pyboy_rs.__version__ == '0.1.5', pyboy_rs.__version__"
      - name: Require clock control in the release wheel
        run: python -c "import pyboy_rs; assert pyboy_rs.HAS_CLOCK_CONTROL, pyboy_rs.FEATURES"
      - name: Require whole-bank reads in the release wheel
        run: python -c "import pyboy_rs; assert 'bank_bytes' in pyboy_rs.FEATURES, pyboy_rs.FEATURES"
      - name: Run the emulator, RTC and checkpoint suites without silent skips
        run: |
          python -m pytest -rs -q --ignore=tests/test_snapshot_native.py --ignore=tests/test_real_roms.py | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "Unexpected skips"; exit 1; fi
      - run: ruff check src tests tools

  native:
    name: native decoder crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml -- -D warnings
      - name: Build and install the decoder wheel
        run: |
          python -m pip install maturin
          maturin build --release --manifest-path native/Cargo.toml --out dist
          python -m pip install dist/pokesim_core_native-*.whl
          python -m pip install -e ".[dev]"
      - name: Run the decoder tests against the Rust decoder
        run: |
          POKESIM_CORE_DECODER=rust python -m pytest -rs -q tests/test_snapshot_native.py | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "Unexpected skips"; exit 1; fi

  compatibility:
    name: 0.1.x surface without an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install only the built wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv clean
          clean/bin/python -m pip install dist/pokecore-*.whl pytest
          clean/bin/python -c "import importlib.util as u; assert u.find_spec('pyboy_rs') is None and u.find_spec('pyboy') is None"
      - name: Import the surface PokeBench uses and run the tests that need no emulator
        run: |
          clean/bin/python tools/check_legacy_surface.py
          clean/bin/python -m pytest -q -p no:cacheprovider
