name: Rerun failed main
on:
  # A failed push run on main gets its failed jobs run once more, so one flaky job does not leave main
  # without green gate checks. A second failure stays failed. tools/flake_rate.py counts how often a rerun passed.
  workflow_run:
    workflows: [CI, Python install]
    types: [completed]
    branches: [main]
permissions:
  actions: write
jobs:
  rerun:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun the failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
          echo "Reran the failed jobs of $NAME run $RUN for $SHA" >> "$GITHUB_STEP_SUMMARY"
