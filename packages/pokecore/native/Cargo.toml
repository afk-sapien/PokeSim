[package]
name = "pokesim-core-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
publish = false

[lib]
name = "pokesim_core_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }

[profile.release]
lto = "thin"
codegen-units = 1
