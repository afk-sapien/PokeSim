name: Release

# A pushed tag vX.Y.Z checks that the tag equals the version in pyproject.toml and
# pokecore.__version__, runs the tests, builds the wheel and the sdist, and publishes
# a GitHub release for that tag with both files, SHA256SUMS.txt and the CHANGELOG.md
# section for the version as notes. Nothing is published to PyPI.
#
# A manual run (workflow_dispatch) is a dry run: it does all of the checks and builds and
# uploads the files as a workflow artifact only. It never creates, edits or uploads to a
# release. A published release is never modified, even on a tag push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: check, test and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - id: meta
        name: Versions agree (and match the tag on a tag push)
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pokecore/__init__.py)
          echo "pyproject.toml=$version __init__.py=$init"
          test "$init" = "$version" || { echo "::error::__version__ $init does not equal pyproject.toml $version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_TYPE" = tag || { echo "::error::push of a non-tag ref"; exit 1; }
            test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME does not equal v$version"; exit 1; }
          fi
          awk -v v="$version" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::no CHANGELOG.md section '## $version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - run: uv build --wheel --sdist --out-dir dist
      - name: Check the files and write SHA256SUMS.txt
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "pokecore-$VERSION-py3-none-any.whl" "pokecore-$VERSION.tar.gz" > expected.txt
          ls dist | sort > built.txt
          diff <(sort expected.txt) built.txt || { echo "::error::unexpected build output"; exit 1; }
          for file in dist/*; do
            python3 -m venv "clean-$(basename "$file")"
            "clean-$(basename "$file")/bin/python" -m pip install -q "$file"
            "clean-$(basename "$file")/bin/python" -c "import pokecore, sys; assert pokecore.__version__ == sys.argv[1], pokecore.__version__" "$VERSION"
          done
          (cd dist && sha256sum pokecore-* > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mv notes.md dist/notes.md
          { echo '### SHA-256'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    # Only a pushed v* tag reaches this job. A manual run (dry run) never does.
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-files
          path: files
      - name: Create the draft, attach the files, verify them, then publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TAG" || { echo "::error::tag $GITHUB_REF_NAME is not $TAG"; exit 1; }
          mv files/notes.md notes.md
          (cd files && sha256sum -c SHA256SUMS.txt)
          ls files | sort > wanted.txt
          test "$(wc -l < wanted.txt)" -eq 3
          # Only a draft (or one this run creates as a draft) may be modified.
          if gh release view "$TAG" --json isDraft --jq .isDraft > state.txt 2>/dev/null; then
            if [ "$(cat state.txt)" != true ]; then
              echo "::error::release $TAG is already published; refusing to modify it"; exit 1
            fi
            gh release edit "$TAG" --title "PokeSim Core ${TAG#v}" --notes-file notes.md
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              grep -qxF "$name" wanted.txt || gh release delete-asset "$TAG" "$name" --yes
            done
          else
            gh release create "$TAG" --draft --verify-tag --title "PokeSim Core ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" files/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > uploaded.txt
          diff wanted.txt uploaded.txt || { echo "::error::release asset set is wrong"; exit 1; }
          # Download what is attached and check it against SHA256SUMS.txt before publishing.
          mkdir check && gh release download "$TAG" --dir check
          (cd check && sha256sum -c SHA256SUMS.txt)
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json url,isDraft,tagName
